<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCOGEN - Progressive Documentation</title>
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/level-viewer.css">
</head>
<body>
  
  <div class="level-viewer-container">
    
    <!-- Level Navigator Sidebar -->
    <div class="level-navigator">
      <div class="navigator-header">
        <h3>Documentation Levels</h3>
        <div class="scope-lock-indicator">
          <span class="lock-icon">🔒</span>
          <span>Scope Locked</span>
        </div>
      </div>
      
      <div class="level-list" id="level-list">
        <!-- Levels populated here -->
      </div>
      
      <div class="navigator-actions">
        <button class="btn-secondary small" onclick="downloadAllLevels()">
          📥 Download All
        </button>
        <button class="btn-secondary small" onclick="viewScopeDetails()">
          📋 View Locked Scope
        </button>
      </div>
    </div>
    
    <!-- Document Viewer -->
    <div class="document-viewer">
      <div class="viewer-header">
        <div class="viewer-title">
          <h1 id="document-title">Level 1: Executive Summary</h1>
          <span class="page-count" id="page-count">3 pages</span>
        </div>
        <div class="viewer-actions">
          <button class="btn-icon" onclick="downloadCurrent()" title="Download">
            📥
          </button>
          <button class="btn-icon" onclick="printCurrent()" title="Print">
            🖨️
          </button>
          <button class="btn-icon" onclick="shareCurrent()" title="Share">
            🔗
          </button>
          <button class="btn-icon" onclick="toggleFullscreen()" title="Fullscreen">
            ⛶
          </button>
        </div>
      </div>
      
      <!-- Document Content -->
      <div class="document-content" id="document-content">
        <!-- Markdown rendered here -->
      </div>
      
      <!-- Document Footer -->
      <div class="document-footer">
        <div class="footer-nav">
          <button class="btn-secondary" id="prev-level-btn" onclick="navigatePrevLevel()" disabled>
            ← Previous Level
          </button>
          <button class="btn-primary" id="next-level-btn" onclick="navigateNextLevel()">
            Generate Level 2 →
          </button>
        </div>
        
        <div class="document-metadata">
          <span>Generated: <span id="generated-at">-</span></span>
          <span>Modules: <span id="module-count">-</span></span>
          <span>Checksum: <span id="checksum">-</span></span>
        </div>
      </div>
    </div>
    
    <!-- Table of Contents Panel (Collapsible) -->
    <div class="toc-panel" id="toc-panel">
      <div class="toc-header">
        <h4>Table of Contents</h4>
        <button class="toc-toggle" onclick="toggleTOC()">×</button>
      </div>
      <div class="toc-content" id="toc-content">
        <!-- TOC generated from markdown -->
      </div>
    </div>
  </div>
  
  <!-- Scope Details Modal -->
  <div id="scope-details-modal" class="modal">
    <div class="modal-content large">
      <div class="modal-header">
        <h3>Locked Scope Details</h3>
        <button class="modal-close" onclick="closeScopeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="scope-summary">
          <div class="summary-stat">
            <span class="label">Total Modules:</span>
            <span class="value" id="scope-total-modules">-</span>
          </div>
          <div class="summary-stat">
            <span class="label">Locked At:</span>
            <span class="value" id="scope-locked-at">-</span>
          </div>
          <div class="summary-stat">
            <span class="label">Checksum:</span>
            <span class="value" id="scope-checksum">-</span>
          </div>
        </div>
        
        <table class="scope-modules-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Module</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Complexity</th>
            </tr>
          </thead>
          <tbody id="scope-modules-tbody">
            <!-- Modules listed here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/level-viewer.js"></script>
</body>
</html>
