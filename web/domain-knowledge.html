<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Knowledge Manager - Scogen</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        header h1 { color: #333; font-size: 32px; margin-bottom: 8px; }
        header p { color: #666; font-size: 16px; }
        .nav { margin-bottom: 20px; }
        .nav a { display: inline-block; padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 6px; margin-right: 10px; }
        .nav a:hover { background: #45a049; }
        .section { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .section h2 { color: #333; margin-bottom: 20px; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .form-group small { display: block; margin-top: 5px; color: #666; font-size: 12px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-primary:hover { background: #45a049; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .component-item { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd; }
        .component-item h4 { margin-bottom: 10px; color: #333; }
        .component-item .remove-btn { float: right; padding: 5px 10px; font-size: 12px; }
        .domains-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .domain-card { background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .domain-card h3 { margin-bottom: 10px; color: #333; }
        .domain-card p { color: #666; font-size: 14px; margin-bottom: 10px; }
        .domain-card .actions { margin-top: 15px; }
        .domain-card .actions button { margin-right: 10px; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hidden { display: none; }
        .pattern-section { margin-top: 30px; padding-top: 30px; border-top: 2px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Domain Knowledge Manager</h1>
            <p>Manage technical patterns for different domains and platforms</p>
        </header>

        <div class="nav">
            <a href="index.html">← Back to Scogen</a>
        </div>

        <div id="alertContainer"></div>

        <!-- List Existing Domains -->
        <div class="section">
            <h2>Existing Domain Knowledge</h2>
            <div id="domainsList" class="domains-list">
                <p>Loading domains...</p>
            </div>
        </div>

        <!-- Add/Edit Domain Knowledge Form -->
        <div class="section">
            <h2 id="formTitle">Add New Domain Knowledge</h2>
            <form id="domainKnowledgeForm">
                <div class="form-group">
                    <label for="domain">Domain/Platform Type *</label>
                    <input type="text" id="domain" name="domain" required placeholder="e.g., eor-india, hrms, payroll">
                    <small>Unique identifier for this domain (used as filename)</small>
                </div>

                <div class="form-group">
                    <label for="platformType">Platform Type</label>
                    <input type="text" id="platformType" name="platformType" placeholder="e.g., eor-india">
                    <small>Optional: Same as domain if not specified</small>
                </div>

                <div class="pattern-section">
                    <h3>Technical Patterns</h3>
                    <div id="patternsContainer">
                        <!-- Patterns will be added here dynamically -->
                    </div>
                    <button type="button" class="btn btn-secondary" onclick="addPattern()">+ Add Pattern</button>
                </div>

                <div class="form-group" style="margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">Save Domain Knowledge</button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/domain-knowledge-form.js"></script>
</body>
</html>
